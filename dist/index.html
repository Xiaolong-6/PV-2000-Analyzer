<script>// src/core/stats.js
(function(root){
  const PV=root.PV2000=root.PV2000||{};
  const finite=a=>(a||[]).map(Number).filter(Number.isFinite);

(function(root){
  const PV=root.PV2000=root.PV2000||{};

    const pts=[],nx=Math.ceil(radius/pitchX),ny=Math.ceil(radius/pitchY),eps=1e-9;
