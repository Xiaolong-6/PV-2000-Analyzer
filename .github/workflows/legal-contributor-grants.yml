name: Legal contributor grants

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  contributor-grants:
    if: ${{ github.event_name == 'pull_request_target' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify contributor grants
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          CLA_ACCEPTANCE: I have read and agree to CLA.md for this pull request, and I have authority to grant the rights described there.
          DATA_ACCEPTANCE: I have read and agree to REFERENCE_DATA_LICENSE.md for the reference material in this pull request, and I have authority to grant those rights.
        shell: bash
        run: |
          set -euo pipefail

          api_get() {
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            PR_NUMBER="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
            PR_AUTHOR="$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")"
            HEAD_SHA="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          else
            PR_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
            PR_JSON="$(api_get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            PR_AUTHOR="$(jq -r '.user.login' <<<"$PR_JSON")"
            HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          fi

          post_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(jq -nc \
              --arg state "$state" \
              --arg context "Legal / contributor grants" \
              --arg description "$description" \
              --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR_NUMBER" \
              '{state:$state, context:$context, description:$description, target_url:$target_url}')"

            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -d "$payload" >/dev/null
          }

          if [[ "$PR_AUTHOR" == "$REPO_OWNER" ]]; then
            post_status success "Repository owner contribution; CLA self-grant not required."
            exit 0
          fi

          COMMENTS_FILE="$(mktemp)"
          : > "$COMMENTS_FILE"
          for page in $(seq 1 10); do
            PAGE_JSON="$(api_get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100&page=$page")"
            jq -c '.[]' <<<"$PAGE_JSON" >> "$COMMENTS_FILE"
            COUNT="$(jq 'length' <<<"$PAGE_JSON")"
            [[ "$COUNT" -lt 100 ]] && break
          done

          has_exact_author_comment() {
            local required="$1"
            jq -s -e \
              --arg author "$PR_AUTHOR" \
              --arg required "$required" \
              'any(.[]; .user.login == $author and (.body // "") == $required)' \
              "$COMMENTS_FILE" >/dev/null
          }

          if ! has_exact_author_comment "$CLA_ACCEPTANCE"; then
            post_status failure "PR author must post the exact CLA acceptance comment."
            echo "::error::Missing exact CLA acceptance comment from @$PR_AUTHOR."
            exit 1
          fi

          REFERENCE_REQUIRED=0
          for page in $(seq 1 10); do
            FILES_JSON="$(api_get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page")"
            if jq -e 'any(.[]; (.filename | startswith("reference_data/")))' <<<"$FILES_JSON" >/dev/null; then
              REFERENCE_REQUIRED=1
            fi
            COUNT="$(jq 'length' <<<"$FILES_JSON")"
            [[ "$COUNT" -lt 100 ]] && break
          done

          if [[ "$REFERENCE_REQUIRED" -eq 1 ]] && ! has_exact_author_comment "$DATA_ACCEPTANCE"; then
            post_status failure "Reference-data change also requires the exact data-license acceptance."
            echo "::error::Missing exact Reference Data License acceptance comment from @$PR_AUTHOR."
            exit 1
          fi

          if [[ "$REFERENCE_REQUIRED" -eq 1 ]]; then
            post_status success "CLA and Reference Data License acceptances verified."
          else
            post_status success "CLA acceptance verified."
          fi
