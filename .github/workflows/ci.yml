name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dev tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Quality gates
        run: npm run check
      - name: Validator launcher smoke
        run: |
          npm run validate:qss
          npm run validate:lbic
      - name: Build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: pv2000-data-viewer-dist
          path: dist/index.html
          if-no-files-found: error
